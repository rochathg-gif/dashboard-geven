.sel:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px rgba(58,91,217,.12)}
.pills{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}

.kval{font-size:19px;font-weight:700;color:var(--tx);line-height:1.1;margin-bottom:5px}
.ksub{font-size:11px;display:flex;align-items:center;gap:3px}

function genIns(d){
  const ins=[];const at=d.atingimento;

  else if(at>=100)ins.push({tp:'positive',tag:'META ATINGIDA',t:'Objetivo parcial superado',x:`${fmtN(at,1)}% — superávit de ${fmtM(d.desvio)} (${fmtN(d.desvio_pct,1)}%).`});
  else if(at>=80)ins.push({tp:'neutral',tag:'ATENÇÃO',t:'Meta próxima, não atingida',x:`${fmtN(at,1)}% — gap de ${fmtM(Math.abs(d.desvio))} (${fmtN(Math.abs(d.desvio_pct),1)}%).`});
  else ins.push({tp:'negative',tag:'CRÍTICO',t:'Meta em risco significativo',x:`Apenas ${fmtN(at,1)}% da meta — déficit de ${fmtM(Math.abs(d.desvio))} (${fmtN(Math.abs(d.desvio_pct),1)}%).`});
  if(d.evolucao>15)ins.push({tp:'positive',tag:'CRESCIMENTO',t:'Expansão forte vs. anterior',x:`Receita cresceu ${fmtN(d.evolucao,1)}% vs. período anterior.`});
  else if(d.evolucao>0)ins.push({tp:'positive',tag:'CRESCIMENTO',t:'Crescimento vs. anterior',x:`Receita cresceu ${fmtN(d.evolucao,1)}% vs. mesmo período anterior.`});
  else ins.push({tp:'negative',tag:'RETRAÇÃO',t:'Queda vs. período anterior',x:`Receita caiu ${fmtN(Math.abs(d.evolucao),1)}% vs. anterior. Investigar clientes com redução de tráfego.`});
  const vt=d.ticket_ant>0?((d.ticket_medio-d.ticket_ant)/d.ticket_ant*100):0;
  if(vt>15)ins.push({tp:'positive',tag:'TÍQUETE',t:'Tíquete médio em alta',x:`+${fmtN(vt,1)}% (R$${fmtN(d.ticket_ant)} → R$${fmtN(d.ticket_medio)}). Indica upsell ou mix premium.`});
  else if(vt<-10)ins.push({tp:'negative',tag:'TÍQUETE',t:'Queda de tíquete médio',x:`${fmtN(vt,1)}%. Avaliar erosão de preço ou mudança de mix.`});
  if(d.sem_receita>0)ins.push({tp:'negative',tag:'INATIVOS',t:`${d.sem_receita} cliente(s) sem receita`,x:`${(d.sem_receita/d.n_clientes*100).toFixed(0)}% da carteira sem movimentação. Acionar imediatamente.`});
  const ab50=d.distribuicao['<50%'];
  if(ab50>8)ins.push({tp:'negative',tag:'ATIVAÇÃO',t:`${ab50} clientes abaixo de 50% da meta`,x:'Alta concentração crítica. Priorize ativação e investigação de causa raiz.'});
  if(d.top5[0]&&(d.top5[0].Receita/d.receita)>0.20)ins.push({tp:'neutral',tag:'CONCENTRAÇÃO',t:'Alta dependência do maior cliente',x:`Maior cliente = ${fmtN(d.top5[0].Receita/d.receita*100,1)}% da receita. Risco de concentração.`});
  if(d.distribuicao['>150%']>=10)ins.push({tp:'positive',tag:'REFERÊNCIA',t:`${d.distribuicao['>150%']} clientes >150% da meta`,x:'Excelente base. Explorar upselling e cases de sucesso.'});
  ins.push({tp:'info',tag:'CARTEIRA',t:'Equilíbrio da base',x:`${d.acima_meta} acima (${(d.acima_meta/d.n_clientes*100).toFixed(0)}%), ${d.abaixo_meta} abaixo. ${d.abaixo_meta>d.acima_meta?'Maioria abaixo do objetivo.':'Boa distribuição.'}`});
  return ins;
}

  const r=50,cx=63,cy=63,sw=11,ci=2*Math.PI*r,acA=tot>0?(ac/tot)*ci:0,g=1.5;
  const donut=`<svg class="ds" viewBox="0 0 126 126"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f0f2f7" stroke-width="${sw}"/>${ac>0?`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#22c55e" stroke-width="${sw}" stroke-dasharray="${acA-g} ${ci-(acA-g)}" stroke-dashoffset="${ci/4}" stroke-linecap="round"/>`:''}${ab>0?`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#ef4444" stroke-width="${sw}" stroke-dasharray="${ci-acA-g} ${acA+g}" stroke-dashoffset="${ci/4-acA+g}" stroke-linecap="round"/>`:''} <text x="${cx}" y="${cy-3}" text-anchor="middle" font-family="Inter" font-size="16" font-weight="700" fill="#1a1f36">${tot}</text><text x="${cx}" y="${cy+12}" text-anchor="middle" font-family="Inter" font-size="9" fill="#8a94a6">clientes</text></svg>`;
  const barsHtml=d.top5.map(c=>{const rH=Math.round(c.Receita/maxBar*140);const mH=Math.round(c['Meta Parcial']/maxBar*140);const lbl=c['Grupo Cliente'].length>16?c['Grupo Cliente'].substring(0,15)+'…':c['Grupo Cliente'];return`<div class="bgrp"><div class="bpair" style="height:140px"><div class="br" style="width:24px;height:${rH}px;background:#3a5bd9" title="${c['Grupo Cliente']}: ${fmtBR(c.Receita)}"></div><div class="br" style="width:15px;height:${mH}px;background:#f59e0b;opacity:.85" title="Meta: ${fmtBR(c['Meta Parcial'])}"></div></div><div class="blbl" title="${c['Grupo Cliente']}">${lbl}</div></div>`;  }).join('');
  const semHtml=d.sem_rec.length>0?d.sem_rec.map(c=>{const nm=c['Grupo Cliente']||'(sem nome)';return`<div class="sri"><span class="srd"></span><span class="srn" title="${nm}">${nm}</span><span class="srm">${c['Meta Parcial']>0?'Meta: '+fmtBR(c['Meta Parcial']):'Sem meta'}</span></div>`;}).join(''):'<div style="padding:16px;text-align:center;color:var(--gn);font-size:12px;font-weight:600">✅ Todos com receita.</div>';
  document.getElementById('ps').innerHTML=`
  <div class="krow">
    <div class="kpi"><div class="ktop"><span class="klbl">Receita Realizada</span><div class="kico ibl">📈</div></div><div class="kval">${fmtBR(d.receita)}</div><div class="ksub ${d.evolucao>=0?'pos':'neg'}">${d.evolucao>=0?'▲':'▼'} ${fmtN(Math.abs(d.evolucao),1)}% vs anterior</div></div>
    <div class="kpi"><div class="ktop"><span class="klbl">Meta Parcial</span><div class="kico ior">🎯</div></div><div class="kval">${fmtBR(d.meta)}</div><div class="ksub ${d.desvio>=0?'pos':'neg'}">${d.desvio>=0?'+':''}${fmtM(d.desvio)} · ${d.desvio>=0?'+':''}${fmtN(d.desvio_pct,1)}%</div></div>
    <div class="kpi"><div class="ktop"><span class="klbl">Atingimento da Meta</span><div class="kico ${d.atingimento>=100?'ign':'ird'}">${d.atingimento>=100?'✅':'⚠️'}</div></div><div class="kval" style="color:${bclr}">${fmtN(d.atingimento,1)}%</div><div class="kbar"><div class="kbf" style="width:${bp}%;background:${bclr}"></div></div></div>
    <div class="kpi"><div class="ktop"><span class="klbl">Tíquete Médio</span><div class="kico ibl">💲</div></div><div class="kval">R$ ${fmtN(d.ticket_medio)}</div><div class="ksub ${d.ticket_medio>=d.ticket_ant?'pos':'neg'}">${d.ticket_medio>=d.ticket_ant?'▲':'▼'} ${d.ticket_ant>0?fmtN(Math.abs((d.ticket_medio-d.ticket_ant)/d.ticket_ant*100),1):'—'}% · ant R$${fmtN(d.ticket_ant)}</div></div>
    <div class="kpi"><div class="ktop"><span class="klbl">Clientes Ativos</span><div class="kico ign">👥</div></div><div class="kval">${ativos}<span style="font-size:13px;color:var(--mu)">/${d.n_clientes}</span></div><div class="ksub neg">${d.sem_receita} sem receita</div></div>
    <div class="kpi"><div class="ktop"><span class="klbl">Acima da Meta</span><div class="kico ign">✅</div></div><div class="kval" style="color:var(--gn)">${d.acima_meta}</div><div class="ksub neg">${d.abaixo_meta} abaixo · ${(d.acima_meta/d.n_clientes*100).toFixed(0)}% da carteira</div></div>
  </div>
  <div class="ins"><div class="insh"><span style="font-size:15px">💡</span><span class="inst">Análise da Carteira & Recomendações</span></div><div class="insg">${ins.map(i=>`<div class="insc"><div class="instg ${i.tp}">${i.tag}</div><div class="instt">${i.t}</div><div class="instx">${i.x}</div></div>`).join('')}</div></div>
  <div class="g31">
    <div class="card"><div class="chd"><div><div class="ct">Top 5 — Maiores Clientes</div><div class="cs">Faturamento vs Meta Parcial</div></div><div class="ctag">R$ Reais</div></div><div style="padding:14px 18px"><div class="bchart">${barsHtml}</div><div class="bleg"><div class="bli"><div class="bld" style="background:#3a5bd9"></div>Faturamento</div><div class="bli"><div class="bld" style="background:#f59e0b"></div>Meta</div></div></div></div>
    <div class="card"><div class="chd"><div><div class="ct">Estrutura da Carteira</div><div class="cs">Positivação vs meta</div></div></div><div class="dwrap">${donut}<div class="dstats"><div class="dstat"><div class="dsl">Acima Meta</div><div class="dsv gn">${ac}</div></div><div class="dstat"><div class="dsl">Abaixo Meta</div><div class="dsv rd">${ab}</div></div></div></div><div class="dft"><span>Ativos: ${ativos}/${d.n_clientes}</span><span>Inativos: ${d.sem_receita}</span></div></div>
  </div>
  <div class="stit">Top 10 Desvios — Positivos e Negativos</div>
  <div class="g2">
    <div class="card"><div class="chd"><div><div class="ct">🟢 Top 10 Desvios Positivos</div><div class="cs">Clientes com maior superávit</div></div></div>${d.pos_dev.length>0?`<table class="dt"><thead><tr><th>Cliente</th><th>Receita</th><th>Meta</th><th>Ating.</th><th>Evolução</th><th>Desvio +</th></tr></thead><tbody>${d.pos_dev.map(c=>devRow(c,true)).join('')}</tbody></table>`:'<div style="padding:16px;text-align:center;color:var(--mu);font-size:12px">Nenhum desvio positivo.</div>'}</div>
    <div class="card"><div class="chd"><div><div class="ct">🔴 Top 10 Desvios Negativos</div><div class="cs">Clientes com maior déficit</div></div></div>${d.neg_dev.length>0?`<table class="dt"><thead><tr><th>Cliente</th><th>Receita</th><th>Meta</th><th>Ating.</th><th>Evolução</th><th>Desvio −</th></tr></thead><tbody>${d.neg_dev.map(c=>devRow(c,false)).join('')}</tbody></table>`:'<div style="padding:16px;text-align:center;color:var(--mu);font-size:12px">Nenhum desvio negativo.</div>'}</div>
  </div>
  <div class="g2">
    <div class="g2" style="gap:14px;margin-bottom:0">
      <div class="card"><div class="chd"><div><div class="ct">Distribuição de Atingimento</div><div class="cs">${d.n_clientes} clientes</div></div></div>${Object.entries(d.distribuicao).map(([l,n])=>`<div class="dr"><span class="dl">${l}</span><div class="do"><div class="df" style="width:${Math.max(n/distMax*100,2)}%;background:${dc(l)}">${n>0?n:''}</div></div><span class="dn">${n}</span></div>`).join('')}</div>
      <div class="card"><div class="chd"><div><div class="ct">Participação Top 5</div><div class="cs">% da receita total</div></div></div>${d.top5.map((c,i)=>{const s=c.Receita/d.receita*100;const ms=d.top5[0].Receita/d.receita*100;return`<div class="shr"><span class="shrk">${i+1}</span><span class="shn" title="${c['Grupo Cliente']}">${c['Grupo Cliente']}</span><div class="shbo"><div class="shbf" style="width:${s/ms*100}%"></div></div><span class="shp">${fmtN(s,1)}%</span></div>`;}).join('')}<div class="shr" style="opacity:.5"><span class="shrk">+</span><span class="shn">Demais</span><div class="shbo"><div class="shbf" style="width:${Math.max(0,100-d.top5.reduce((a,c)=>a+c.Receita/d.receita*100,0))/100*100}%;background:var(--mu)"></div></div><span class="shp" style="color:var(--mu)">${fmtN(Math.max(0,100-d.top5.reduce((a,c)=>a+c.Receita/d.receita*100,0)),1)}%</span></div></div>
    </div>
    <div class="card"><div class="chd"><div><div class="ct">🔴 Clientes Sem Receita</div><div class="cs">${d.sem_rec.length} cliente(s) — acionar imediatamente</div></div></div>${semHtml}</div>
  </div>`;
}
function buildSel(){
  const s=document.getElementById('sls');
  Object.keys(DATA).forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o);});
  s.addEventListener('change',()=>renderSeller(s.value));
}
renderCorp();buildSel();renderSeller(Object.keys(DATA)[0]);
</script>
</body>
</html>
